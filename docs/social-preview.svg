  <text x="80" y="210" fill="#f0f6fc" font-size="64" font-weight="700">Your Growatt inverter, live,</text>
  <text x="80" y="284" fill="#f0f6fc" font-size="64" font-weight="700">on <tspan fill="#f5a524">your own dashboard.</tspan></text>
  <text x="80" y="340" fill="#c9d1d9" font-size="28">Readings every second, locally. The Growatt cloud still gets one every 5 min.</text>
