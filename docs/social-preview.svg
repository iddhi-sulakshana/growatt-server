  <text x="200" y="482" fill="#c9d1d9">decoded → dashboard <tspan fill="#3fb950" font-weight="700">in ~0.5 s</tspan> · relayed to Growatt <tspan fill="#f5a524" font-weight="700">every 5 min</tspan></text>
