server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS, resolved per request: nginx starts even while the backend is
    # down and answers 502 until it is up, instead of refusing to boot.
    resolver 127.0.0.11 ipv6=off valid=10s;

    # The SPA calls the relative /api/v1 (VITE_API_URL), so the API answers on this origin.
    location /api/ {
        set $api_upstream http://backend:3000;
        proxy_pass $api_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Never cache the entry points, so a redeploy is picked up on the next load.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Vite's hashed bundles never change under the same name.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Client-side routes (react-router) fall back to the app shell.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
